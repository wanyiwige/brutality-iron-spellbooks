plugins { id 'net.minecraftforge.gradle' version '[6.0,6.2)' }
version = mod_version
group = 'cn.wanyiwige.brutalityiron'
base { archivesName = 'brutality_iron_spellbooks' }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
minecraft {
    mappings channel: 'official', version: '1.20.1'
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')
    runs {
        server {
            workingDirectory project.file('run')
            args '--nogui'
            mods { brutality_iron { source sourceSets.main } }
        }
    }
}
repositories {
    flatDir { dirs 'libs', '../wans-iron-expansion/libs', '../mod-backports-1.20.1/forge/aces_spell_utils/libs' }
}
dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.18'
    implementation fg.deobf('local:irons_spellbooks:3.16.3')
    implementation fg.deobf('local:brutality:0.8.5')
    implementation fg.deobf('local:terramity:0.9.8')
    implementation fg.deobf('local:curios-forge:5.14.1')
    implementation fg.deobf('blank:geckolib-forge-1.20.1:4.8.3')
    implementation fg.deobf('local:irons_lib:local')
    implementation fg.deobf('local:playeranimator:local')
    implementation fg.deobf('local:photon:local')
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.named('jar', Jar).configure {
    from 'THIRD_PARTY_NOTICES.md'
    manifest.attributes('MixinConfigs': 'brutality_iron.mixins.json')
    finalizedBy 'reobfJar'
}
